services:
  whatsapper:
    image: whatsapper:local
    build:
      context: .
    container_name: whatsapper
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - whatsapper:/data
    ports:
      - "127.0.0.1:4010:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  whatsapper:
